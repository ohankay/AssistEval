name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, python: "3.10" }
          - { arch: x64, python: "3.14" }
          - { arch: x86, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - run: pip install --prefer-binary -e ".[dev]"
      - name: Dependency check
        run: |
          pip check
          python -c "import requests, yaml, dotenv, truststore, struct; print('deps OK', struct.calcsize('P') * 8, 'bit')"
      - run: pytest -v
