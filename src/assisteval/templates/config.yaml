# Gizli olmayan ayarlar. Şifreler ve müşteri bilgileri .env dosyasında (.env.example'a bakın).

assistant:
  base_url: https://mobileprep.kuveytturk.com.tr/BOA.Integration.MobileBranch
  chatbot_message_url: https://boaprep.kuveytturk.com.tr/chatbot//api/Chat/Message
  channel_id: 5
  language_id: 1
  main_resource_code: MOBRMAINPG
  main_resource_code_dashboard: MOBRDASHBO
  main_resource_id: 22027
  token_refresh_seconds: 240   # token'lar 5 dk geçerli, 4 dk'da bir yeniden login
  timeout_seconds: 60
  device:
    device_id: B82E44F4-1688-4D0B-9F1E-B5174DF579D3
    device_model: iPhone 15 Pro Max
    device_os_name: IOS
    device_os_version: "26.6"
    app_name: IOS MobileBranch
    app_version: 7.2.5
    mobile_application_name: OrganikProd
    pwf_application_name: KTIOSDev

# LLM'ler: kurum içi sunucularda çalışan OpenAI uyumlu endpoint'ler (vLLM, Ollama, LM Studio, TGI...).
# Bulut sağlayıcı yoktur, internete çıkılmaz. İki LLM birbirinden bağımsızdır; ikisine aynı sunucu ve
# model yazılabilir. base_url /v1 ile biter (Ollama: http://sunucu:11434/v1, vLLM: http://sunucu:8000/v1).
# Sunucu anahtar istiyorsa (vLLM --api-key, iç gateway) .env'deki SIMULATOR_API_KEY / JUDGE_API_KEY.
# Bu sunuculara her zaman proxy'siz gidilir (NO_PROXY'e eklenir). Bağlantı kontrolü: assisteval check --llm

# Simüle müşteri: yönlendirmeli modda persona/hedef/yönlendirmeye göre replik üretir
simulator:
  base_url: http://localhost:8000/v1
  model: qwen
  temperature: 0
  timeout_seconds: 120
  # max_tokens: 1024
  # İsteğe olduğu gibi eklenen alanlar. Qwen3 + vLLM'de düşünme modunu kapatmak için:
  # extra_body:
  #   chat_template_kwargs: {enable_thinking: false}

# Değerlendirme hakemi: promptfoo'daki llm-rubric (ve diğer model-graded) assertion'ları.
# Drift'in hakemden değil asistandan geldiğinden emin olmak için hakem modeli sabit tutulmalı.
judge:
  base_url: http://localhost:8000/v1
  model: qwen
  temperature: 0
  timeout_seconds: 120
  # max_tokens: 1024
  # extra_body:
  #   chat_template_kwargs: {enable_thinking: false}

output_dir: runs
